<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leafwork – Plant Shop Demo</title>
<style>
  :root {
    --bg: #eef2ef;
    --surface: #ffffff;
    --ink: #1c2b2a;
    --muted: #5d6e6b;
    --line: #d5dfdb;
    --accent: #2f6f5e;
    --accent-ink: #ffffff;
    --pop: #f2c14e;
    --danger: #b3382c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121b1a;
      --surface: #1b2827;
      --ink: #e8f0ed;
      --muted: #96a8a4;
      --line: #2b3b39;
      --accent: #5fb89f;
      --accent-ink: #0d1514;
      --danger: #ef8a7e;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  button { font: inherit; cursor: pointer; color: inherit; }
  :focus-visible { outline: 3px solid var(--pop); outline-offset: 2px; }

  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 16px;
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .logo { font-family: Georgia, "Times New Roman", serif; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; }
  .search {
    flex: 1; max-width: 420px; margin-left: auto;
    padding: 9px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit;
  }
  .cart-btn {
    position: relative; padding: 9px 16px; border-radius: 999px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600;
  }
  .badge {
    display: inline-block; min-width: 22px; margin-left: 6px; padding: 0 6px;
    border-radius: 999px; background: var(--pop); color: #1c2b2a; font-size: .8rem; text-align: center;
  }

  main { max-width: 1100px; margin: 0 auto; padding: 28px 24px 64px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(1.8rem, 4vw, 2.6rem); letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 6px 0 22px; max-width: 60ch; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .chip {
    padding: 6px 16px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface);
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .thumb { height: 150px; display: grid; place-items: center; font-size: 4rem; }
  .info { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .info h3 { font-size: 1.05rem; }
  .info p { color: var(--muted); font-size: .9rem; flex: 1; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .price { font-weight: 700; font-size: 1.1rem; }
  .add { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font-weight: 600; }
  .add:hover { background: var(--accent); color: var(--accent-ink); }
  .empty { grid-column: 1 / -1; padding: 48px 0; text-align: center; color: var(--muted); }

  /* Cart drawer */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  aside {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100%);
    background: var(--surface); border-left: 1px solid var(--line);
    transform: translateX(100%); transition: transform .25s; z-index: 30;
    display: flex; flex-direction: column;
  }
  aside.open { transform: none; }
  .drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-bottom: 1px solid var(--line); }
  .drawer-head h2 { font-size: 1.2rem; }
  .close { border: none; background: none; font-size: 1.6rem; line-height: 1; padding: 4px 8px; }
  .items { flex: 1; overflow-y: auto; padding: 8px 20px; }
  .item { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .item .e { font-size: 2rem; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 10px; }
  .item .meta { flex: 1; }
  .item .meta small { color: var(--muted); display: block; }
  .qty { display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; }
  .qty button { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); }
  .remove { border: none; background: none; color: var(--danger); font-size: .85rem; text-decoration: underline; }
  .summary { padding: 18px 20px; border-top: 1px solid var(--line); }
  .summary .line { display: flex; justify-content: space-between; margin-bottom: 6px; color: var(--muted); }
  .summary .total { color: var(--ink); font-weight: 700; font-size: 1.15rem; margin-top: 8px; }
  .checkout { width: 100%; margin-top: 12px; padding: 12px; border-radius: 10px; border: none; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .checkout:disabled { opacity: .45; cursor: not-allowed; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px;
    opacity: 0; transition: .2s; z-index: 40; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header>
  <span class="logo">Leafwork</span>
  <input class="search" id="search" type="search" placeholder="Search plants and pots" aria-label="Search products">
  <button class="cart-btn" id="openCart" aria-label="Open cart">Cart<span class="badge" id="count">0</span></button>
</header>

<main>
  <h1>Plants for small spaces</h1>
  <p class="sub">A demo storefront. Add items, change quantities and check out. Nothing is actually sold.</p>
  <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="overlay"></div>
<aside id="drawer" aria-label="Shopping cart" aria-hidden="true">
  <div class="drawer-head">
    <h2>Your cart</h2>
    <button class="close" id="closeCart" aria-label="Close cart">&times;</button>
  </div>
  <div class="items" id="items"></div>
  <div class="summary">
    <div class="line"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
    <div class="line"><span>Shipping</span><span id="shipping">$0.00</span></div>
    <div class="line total"><span>Total</span><span id="total">$0.00</span></div>
    <button class="checkout" id="checkout" disabled>Place order</button>
  </div>
</aside>

<div class="toast" id="toast" role="status"></div>

<script>
  // ---- Data ----
  const PRODUCTS = [
    { id: 1, name: "Monstera",       cat: "Plants",  price: 28, emoji: "🪴", bg: "#cfe8da", desc: "Big split leaves, easygoing in bright shade." },
    { id: 2, name: "Snake plant",    cat: "Plants",  price: 22, emoji: "🌿", bg: "#dcebc4", desc: "Nearly unkillable. Tolerates low light." },
    { id: 3, name: "Aloe vera",      cat: "Plants",  price: 14, emoji: "🌵", bg: "#e7efc9", desc: "Sun lover. Water only when fully dry." },
    { id: 4, name: "Fiddle-leaf fig",cat: "Plants",  price: 45, emoji: "🍃", bg: "#c6e3d3", desc: "A statement tree for a bright corner." },
    { id: 5, name: "Ceramic pot",    cat: "Pots",    price: 18, emoji: "🏺", bg: "#f3dcc8", desc: "Hand-glazed, 15 cm, with drainage hole." },
    { id: 6, name: "Hanging planter",cat: "Pots",    price: 24, emoji: "🧺", bg: "#f1e2b8", desc: "Woven cotton rope, holds up to 3 kg." },
    { id: 7, name: "Watering can",   cat: "Tools",   price: 16, emoji: "🚿", bg: "#cde1ee", desc: "Long spout for reaching under leaves." },
    { id: 8, name: "Potting mix",    cat: "Tools",   price: 9,  emoji: "🌱", bg: "#e0d6c8", desc: "5 L bag, airy blend for indoor plants." }
  ];
  const FREE_SHIPPING_OVER = 60, SHIPPING_FEE = 6;

  // ---- State ----
  let cart = load();       // { productId: qty }
  let category = "All";
  let query = "";

  function load() {
    try { return JSON.parse(localStorage.getItem("leafwork-cart")) || {}; }
    catch (e) { return {}; }
  }
  function save() {
    try { localStorage.setItem("leafwork-cart", JSON.stringify(cart)); } catch (e) {}
  }

  const $ = (id) => document.getElementById(id);
  const money = (n) => "$" + n.toFixed(2);
  const find = (id) => PRODUCTS.find((p) => p.id === Number(id));

  // ---- Product list ----
  function renderFilters() {
    const cats = ["All", ...new Set(PRODUCTS.map((p) => p.cat))];
    $("filters").innerHTML = cats.map((c) =>
      `<button class="chip" data-cat="${c}" aria-pressed="${c === category}">${c}</button>`
    ).join("");
  }

  function renderProducts() {
    const list = PRODUCTS.filter((p) =>
      (category === "All" || p.cat === category) &&
      p.name.toLowerCase().includes(query.toLowerCase())
    );
    $("grid").innerHTML = list.length ? list.map((p) => `
      <article class="card">
        <div class="thumb" style="background:${p.bg}" aria-hidden="true">${p.emoji}</div>
        <div class="info">
          <h3>${p.name}</h3>
          <p>${p.desc}</p>
          <div class="row">
            <span class="price">${money(p.price)}</span>
            <button class="add" data-add="${p.id}">Add to cart</button>
          </div>
        </div>
      </article>`).join("")
      : `<p class="empty">No products match your search. Try a different word or category.</p>`;
  }

  // ---- Cart ----
  function renderCart() {
    const ids = Object.keys(cart);
    const subtotal = ids.reduce((s, id) => s + find(id).price * cart[id], 0);
    const shipping = subtotal === 0 || subtotal >= FREE_SHIPPING_OVER ? 0 : SHIPPING_FEE;

    $("count").textContent = ids.reduce((n, id) => n + cart[id], 0);
    $("subtotal").textContent = money(subtotal);
    $("shipping").textContent = shipping ? money(shipping) : (subtotal ? "Free" : "$0.00");
    $("total").textContent = money(subtotal + shipping);
    $("checkout").disabled = ids.length === 0;

    $("items").innerHTML = ids.length ? ids.map((id) => {
      const p = find(id);
      return `
        <div class="item">
          <div class="e" style="background:${p.bg}" aria-hidden="true">${p.emoji}</div>
          <div class="meta">
            <strong>${p.name}</strong>
            <small>${money(p.price)} each</small>
            <div class="qty">
              <button data-dec="${id}" aria-label="Decrease quantity of ${p.name}">&minus;</button>
              <span>${cart[id]}</span>
              <button data-inc="${id}" aria-label="Increase quantity of ${p.name}">+</button>
            </div>
          </div>
          <div style="text-align:right">
            <div class="price">${money(p.price * cart[id])}</div>
            <button class="remove" data-rm="${id}">Remove</button>
          </div>
        </div>`;
    }).join("") : `<p class="empty">Your cart is empty. Add a plant to get started.</p>`;
  }

  function change(id, delta) {
    cart[id] = (cart[id] || 0) + delta;
    if (cart[id] <= 0) delete cart[id];
    save(); renderCart();
  }

  // ---- UI helpers ----
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove("show"), 1800);
  }
  function toggleCart(open) {
    $("drawer").classList.toggle("open", open);
    $("overlay").classList.toggle("open", open);
    $("drawer").setAttribute("aria-hidden", String(!open));
  }

  // ---- Events ----
  $("search").addEventListener("input", (e) => { query = e.target.value; renderProducts(); });
  $("filters").addEventListener("click", (e) => {
    const c = e.target.dataset.cat;
    if (c) { category = c; renderFilters(); renderProducts(); }
  });
  $("grid").addEventListener("click", (e) => {
    const id = e.target.dataset.add;
    if (id) { change(id, 1); toast(find(id).name + " added to cart"); }
  });
  $("items").addEventListener("click", (e) => {
    const d = e.target.dataset;
    if (d.inc) change(d.inc, 1);
    if (d.dec) change(d.dec, -1);
    if (d.rm) change(d.rm, -cart[d.rm]);
  });
  $("openCart").addEventListener("click", () => toggleCart(true));
  $("closeCart").addEventListener("click", () => toggleCart(false));
  $("overlay").addEventListener("click", () => toggleCart(false));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") toggleCart(false); });
  $("checkout").addEventListener("click", () => {
    cart = {}; save(); renderCart(); toggleCart(false);
    toast("Order placed. Thanks for shopping!");
  });

  // ---- Init ----
  renderFilters(); renderProducts(); renderCart();
</script>
</body>
</html>
